name: Backup diario da base de dados

# Corre todos os dias as 03:00 UTC, e tambem manualmente (botao "Run workflow").
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v5

      - name: Instalar PostgreSQL client 17
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Configurar Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Instalar googleapis
        # Tenta ate 3 vezes: o npm install falha por vezes com erros de rede
        # transitorios (ECONNRESET) no runner do GitHub, e nao vale a pena
        # deitar o backup inteiro a perder por causa disso.
        run: |
          for tentativa in 1 2 3; do
            echo "==> Instalar googleapis (tentativa $tentativa/3)..."
            if npm install googleapis --no-save --fetch-retries=5 --fetch-retry-mintimeout=20000; then
              exit 0
            fi
            echo "Tentativa $tentativa falhou; a aguardar 15s antes de repetir..."
            sleep 15
          done
          echo "Erro: nao foi possivel instalar googleapis apos 3 tentativas."
          exit 1

      - name: Executar backup (dump + gzip + upload)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: bash scripts/backup.sh

      - name: Notificar falha por email
        if: failure()
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/notify-failure.sh
