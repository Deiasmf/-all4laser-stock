name: Lembretes de pagamento (envios expedidos)

# Corre 1x/dia as 09:00 UTC. Reenvia ao cliente a cada 7 dias desde a expedicao.
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  lembretes-pagamento:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Instalar PostgreSQL client (psql)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enviar lembretes de pagamento
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: node scripts/lembretes-pagamento.mjs
